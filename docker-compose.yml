# Self-host: `docker compose up -d`, then `docker logs little-dipper | grep claim`.
services:
  little-dipper:
    build: .
    container_name: little-dipper
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # The address people will use. Put a TLS proxy (Caddy, Traefik…) in front for https.
      LD_PUBLIC_URL: ${LD_PUBLIC_URL:-http://localhost:4000}
      MONGODB_URI: mongodb://mongo:27017
    volumes:
      - ld-data:/data
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ld-mongo:/data/db
volumes:
  ld-data:
  ld-mongo:
