# One-click deploy to Render. The claim link prints to the service logs on first boot.
services:
  - type: web
    name: little-dipper
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/node/status
    envVars:
      - key: LD_KEYSTORE_KEY
        generateValue: true # keeps the node identity in the database, encrypted with this secret
      - key: LD_DATA_DIR
        value: /data
    disk: # the SQLite database, file contents and backups live here
      name: little-dipper-data
      mountPath: /data
      sizeGB: 1
